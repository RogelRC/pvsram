name: Build Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app for Windows
        run: bun run tauri build -- --bundles nsis

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesora-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows Build #${{ github.run_number }}
          body: |
            Compilación automática de Windows generada desde `main`.
            - Commit: ${{ github.sha }}
            - Incluye instalador NSIS y ejecutable compilado.
          prerelease: true
          make_latest: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.zip
            src-tauri/target/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
