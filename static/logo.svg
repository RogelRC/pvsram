<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Tesora">
  <defs>
    <linearGradient id="tesoraGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="tesoraSoft" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="tesoraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App mark -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B1220"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#tesoraGrad)" stroke-width="1.5" opacity="0.9"/>

  <!-- Soft inner glow -->
  <circle cx="32" cy="32" r="18" fill="url(#tesoraGrad)" opacity="0.12"/>

  <!-- Abstract vault / shield mark -->
  <path
    d="M32 14.5c6.8 2.8 11.5 4.2 14 4.2v12.4c0 8.2-5.4 14.8-14 17.4-8.6-2.6-14-9.2-14-17.4V18.7c2.5 0 7.2-1.4 14-4.2Z"
    fill="url(#tesoraSoft)"
    opacity="0.18"
    filter="url(#tesoraGlow)"
  />
  <path
    d="M32 16c6.2 2.5 10.4 3.8 12.6 3.8v11.4c0 7.2-4.7 13-12.6 15.4-7.9-2.4-12.6-8.2-12.6-15.4V19.8C21.6 19.8 25.8 18.5 32 16Z"
    fill="none"
    stroke="url(#tesoraGrad)"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Inner coin / balance accent -->
  <circle cx="32" cy="31" r="7.5" fill="none" stroke="url(#tesoraGrad)" stroke-width="1.8"/>
  <path
    d="M32 25.8v10.4M29.2 28.4c.7-1.1 1.9-1.7 3.3-1.7 1.8 0 3 0.9 3 2.2s-1.2 2.1-3.2 2.5c-2 .4-3.2 1.2-3.2 2.6 0 1.4 1.3 2.3 3.3 2.3 1.5 0 2.7-.6 3.4-1.7"
    stroke="url(#tesoraGrad)"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
